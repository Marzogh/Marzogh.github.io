# Jekyll / GitHub Pages configuration
# Docs: https://jekyllrb.com/docs/configuration/

# --- Core site identity ---

title: "Chips'nCode Blog"
description: "Pushing the boundaries of what I can do, one line of code & one wire at a time"

# Custom domain (subdomain)
url: "https://blog.chipsncode.com"
baseurl: ""

# --- Build behaviour ---

timezone: Australia/Brisbane
exclude:
  - README.md

# Markdown / highlighting
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge

# --- Pagination ---
paginate: 10
paginate_path: "/page:num/"

# --- Plugins (GitHub Pages safe) ---
plugins:
  - jekyll-paginate

# --- Comments / analytics ---
disqus: chipsncode
disqus_shortname: chipsncode

google_analytics:

# --- Defaults / metadata ---

defaults:
  - scope:
      path: "" # all files
    values:
      title: "Chips'nCode Blog"
      keywords: "electronics, code, arduino, raspberry pi, SPIFlash, flash, memory, winbond, open source, DIY, maker, hacker"

# Optional theme-specific fields (safe to leave blank)
source_link:
favicon:
touch_icon:

# --- Author ---

author:
  name: Marzogh
  email: marzogh@icloud.com
  github: marzogh
  twitter: Marzogh_
  bio: "Jack of many trades, master of some"
  email_md5: 18f94b6a6b0a37ee759005c81e838e4a

# --- Theme paths (legacy but used by dbyll) ---
rss_path: feed.xml
categories_path: categories.html
tags_path: tags.html