<svg xmlns="http://www.w3.org/2000/svg" width="1272" height="380" viewBox="0 0 1272 380" role="img">
<rect width="1272" height="380" fill="#f7f4ec"/>
<text x="42" y="56" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="700" fill="#23292a" text-anchor="start">From aircraft messages to a local map</text><text x="43" y="94" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#65726f" text-anchor="start">A receiving chain, not a live screenshot</text><rect x="42" y="142" width="252" height="152" rx="14" fill="#fffdf9" stroke="#c9c6ba" stroke-width="2"/><text x="168.0" y="198" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#23292a" text-anchor="middle">Aircraft</text><text x="168.0" y="239" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#65726f" text-anchor="middle">1090 MHz bursts</text><rect x="354" y="142" width="252" height="152" rx="14" fill="#fffdf9" stroke="#c9c6ba" stroke-width="2"/><text x="480.0" y="198" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#23292a" text-anchor="middle">Dipole + RTL-SDR</text><text x="480.0" y="239" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#65726f" text-anchor="middle">Collect the radio signal</text><rect x="666" y="142" width="252" height="152" rx="14" fill="#fffdf9" stroke="#c9c6ba" stroke-width="2"/><text x="792.0" y="198" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#23292a" text-anchor="middle">SDRangel</text><text x="792.0" y="239" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#65726f" text-anchor="middle">Decode ADS-B messages</text><rect x="978" y="142" width="252" height="152" rx="14" fill="#fffdf9" stroke="#c9c6ba" stroke-width="2"/><text x="1104.0" y="198" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#23292a" text-anchor="middle">Aircraft map</text><text x="1104.0" y="239" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#65726f" text-anchor="middle">Plot decoded positions</text><path d="M 311 216 L 338 216" stroke="#597e71" stroke-width="5" stroke-linecap="round" fill="none"/><polygon points="338,216 324,207 324,225" fill="#597e71" /><path d="M 623 216 L 650 216" stroke="#597e71" stroke-width="5" stroke-linecap="round" fill="none"/><polygon points="650,216 636,207 636,225" fill="#597e71" /><path d="M 935 216 L 962 216" stroke="#597e71" stroke-width="5" stroke-linecap="round" fill="none"/><polygon points="962,216 948,207 948,225" fill="#597e71" /><text x="42" y="345" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#65726f" text-anchor="start">Only aircraft whose messages are received and decoded will appear.</text>
</svg>