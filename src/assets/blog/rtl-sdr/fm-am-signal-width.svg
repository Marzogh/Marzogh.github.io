<text x="52" y="137" fill="#a5e8ef" font-size="20" font-family="Arial">FM BROADCAST</text>
<text x="52" y="170" fill="#e5f4f7" font-size="17" font-family="Arial">Wide signal, often carrying music</text>
<text x="52" y="322" fill="#f6cf8a" font-size="20" font-family="Arial">AIRCRAFT AM</text>
<text x="52" y="355" fill="#e5f4f7" font-size="17" font-family="Arial">Narrower signal, carrying voice</text>
