<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="620px" version="1.1" viewBox="0 0 1440 620" width="1440px"><metadata>Author: Prajwal Bhattaram; OpenStarShoot technical figures.</metadata><defs/><title>OpenStarShoot: exposure command and acquisition sequence</title><desc>Protocol schematic for the Orion StarShoot Mono III showing a verified six-byte 100 millisecond exposure command and the typical acquisition sequence, including status polling and cleanup.</desc><rect fill="#FFFFFF" height="620" width="1440" x="0" y="0"/><text fill="#2B5368" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2.3px" text-anchor="start" x="74" y="55">COMMAND STRUCTURE</text><text fill="#5C7077" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="600" text-anchor="end" x="1365" y="55">MONO III   /   USB 2.0 HIGH-SPEED</text><line stroke="#CBD7DC" stroke-width="1.2" x1="74" x2="1366" y1="80" y2="80"/><text fill="#19303A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start" x="74" y="127">EXPOSURE REQUEST  ·  100 ms, bin 1, speed 5</text><text fill="#2B5368" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="600" text-anchor="end" x="1365" y="126">BULK OUT  0x08</text><rect fill="#F7E2BF" height="117" rx="0" width="210" x="74" y="166"/><line stroke="#DD963D" stroke-width="2" x1="74" x2="284" y1="166" y2="166"/><text fill="#5C7077" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="600" text-anchor="start" x="89" y="190">BYTE 0</text><text fill="#19303A" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="41" font-weight="600" text-anchor="start" x="89" y="245">A5</text><text fill="#19303A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" text-anchor="end" x="270" y="246">signature</text><rect fill="#E7EFF2" height="117" rx="0" width="210" x="290" y="166"/><line stroke="#CBD7DC" stroke-width="2" x1="290" x2="500" y1="166" y2="166"/><text fill="#5C7077" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="600" text-anchor="start" x="305" y="190">BYTE 1</text><text fill="#19303A" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="41" font-weight="600" text-anchor="start" x="305" y="245">03</text><text fill="#19303A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" text-anchor="end" x="486" y="246">exposure</text><rect fill="#E7EFF2" height="117" rx="0" width="210" x="506" y="166"/><line stroke="#CBD7DC" stroke-width="2" x1="506" x2="716" y1="166" y2="166"/><text fill="#5C7077" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="600" text-anchor="start" x="521" y="190">BYTE 2</text><text fill="#19303A" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="41" font-weight="600" text-anchor="start" x="521" y="245">06</text><text fill="#19303A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" text-anchor="end" x="702" y="246">speed flags</text><rect fill="#E7EFF2" height="117" rx="0" width="210" x="722" y="166"/><line stroke="#CBD7DC" stroke-width="2" x1="722" x2="932" y1="166" y2="166"/><text fill="#5C7077" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="600" text-anchor="start" x="737" y="190">BYTE 3</text><text fill="#19303A" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="41" font-weight="600" text-anchor="start" x="737" y="245">00</text><text fill="#19303A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" text-anchor="end" x="918" y="246">duration hi</text><rect fill="#E7EFF2" height="117" rx="0" width="210" x="938" y="166"/><line stroke="#CBD7DC" stroke-width="2" x1="938" x2="1148" y1="166" y2="166"/><text fill="#5C7077" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="600" text-anchor="start" x="953" y="190">BYTE 4</text><text fill="#19303A" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="41" font-weight="600" text-anchor="start" x="953" y="245">64</text><text fill="#19303A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" text-anchor="end" x="1134" y="246">duration lo</text><rect fill="#E7EFF2" height="117" rx="0" width="210" x="1154" y="166"/><line stroke="#CBD7DC" stroke-width="2" x1="1154" x2="1364" y1="166" y2="166"/><text fill="#5C7077" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="600" text-anchor="start" x="1169" y="190">BYTE 5</text><text fill="#19303A" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="41" font-weight="600" text-anchor="start" x="1169" y="245">03</text><text fill="#19303A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" text-anchor="end" x="1350" y="246">readout mode</text><text fill="#5C7077" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" x="74" y="323">Each command begins with A5; the four parameter bytes are interpreted by the opcode.</text><text fill="#2B5368" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="600" text-anchor="end" x="1365" y="323">REPLIES / IMAGE DATA  0x82</text><line stroke="#CBD7DC" stroke-width="1.2" x1="74" x2="1366" y1="365" y2="365"/><text fill="#2B5368" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2.3px" text-anchor="start" x="74" y="408">ACQUISITION SEQUENCE</text><line stroke="#CBD7DC" stroke-width="2.5" x1="176" x2="1261" y1="462" y2="462"/><circle cx="176" cy="462" fill="#2B5368" r="10"/><polygon fill="#2B5368" points="278,457 288,462 278,467"/><text fill="#19303A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" x="176" y="517">Identify</text><text fill="#2B5368" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="600" text-anchor="middle" x="176" y="550">0x01</text><circle cx="393" cy="462" fill="#2B5368" r="10"/><polygon fill="#2B5368" points="495,457 505,462 495,467"/><text fill="#19303A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" x="393" y="517">Set window</text><text fill="#2B5368" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="600" text-anchor="middle" x="393" y="550">0x0B</text><circle cx="610" cy="462" fill="#DD963D" r="10"/><polygon fill="#2B5368" points="712,457 722,462 712,467"/><text fill="#19303A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" x="610" y="517">Expose</text><text fill="#2B5368" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="600" text-anchor="middle" x="610" y="550">0x03</text><circle cx="827" cy="462" fill="#2B5368" r="10"/><polygon fill="#2B5368" points="929,457 939,462 929,467"/><text fill="#19303A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" x="827" y="517">Poll status</text><text fill="#2B5368" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="600" text-anchor="middle" x="827" y="550">0x02</text><circle cx="1044" cy="462" fill="#2B5368" r="10"/><polygon fill="#2B5368" points="1146,457 1156,462 1146,467"/><text fill="#19303A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" x="1044" y="517">Read frame</text><text fill="#2B5368" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="600" text-anchor="middle" x="1044" y="550">0x04</text><circle cx="1261" cy="462" fill="#2B5368" r="10"/><text fill="#19303A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle" x="1261" y="517">Stop / idle</text><text fill="#2B5368" font-family="'IBM Plex Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="600" text-anchor="middle" x="1261" y="550">0x05 → 0x02</text><text fill="#5C7077" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="74" y="602">Status is polled until the exposure is ready; an idle-state check follows stop.</text></svg>