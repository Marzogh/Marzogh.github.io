<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">PixInsight Deep-Sky Processing Checklist interface</title>
  <desc id="desc">A stylised technical checklist with a deep blue workflow rail and green completion indicators.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101c"/>
      <stop offset="0.58" stop-color="#0f2337"/>
      <stop offset="1" stop-color="#284a5c"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="12%" r="65%">
      <stop offset="0" stop-color="#79d5ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#79d5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <g fill="#d8efff" opacity=".72">
    <circle cx="92" cy="102" r="2"/><circle cx="245" cy="72" r="1.5"/><circle cx="406" cy="145" r="2.3"/>
    <circle cx="1260" cy="92" r="1.8"/><circle cx="1445" cy="170" r="2.5"/><circle cx="1530" cy="69" r="1.3"/>
    <circle cx="133" cy="812" r="1.4"/><circle cx="1501" cy="830" r="2"/><circle cx="1390" cy="913" r="1.5"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="126" y="105" width="1348" height="790" rx="8" fill="#f8fafb"/>
    <rect x="126" y="105" width="1348" height="54" rx="8" fill="#17191c"/>
    <rect x="126" y="151" width="1348" height="8" fill="#17191c"/>
    <text x="166" y="139" fill="#fff" font-family="ui-monospace, monospace" font-size="17" letter-spacing="2">CHIPS’NCODE  /  INTERACTIVE REFERENCE</text>
    <text x="166" y="232" fill="#17191c" font-family="Arial, sans-serif" font-size="48" font-weight="700">PixInsight Deep-Sky</text>
    <text x="166" y="286" fill="#17191c" font-family="Arial, sans-serif" font-size="48" font-weight="700">Processing Checklist</text>
    <text x="166" y="326" fill="#62676d" font-family="Arial, sans-serif" font-size="20">Broadband OSC workflow · from raw-light screening to delivery output</text>
    <line x1="166" y1="360" x2="1434" y2="360" stroke="#17191c" stroke-width="4"/>
    <g font-family="Arial, sans-serif" font-size="16">
      <rect x="166" y="395" width="183" height="48" rx="3" fill="#304b63"/><text x="190" y="426" fill="#fff">01 · Setup</text>
      <rect x="361" y="395" width="183" height="48" rx="3" fill="#e7ebee"/><text x="385" y="426" fill="#26313a">02 · Blink</text>
      <rect x="556" y="395" width="183" height="48" rx="3" fill="#e7ebee"/><text x="580" y="426" fill="#26313a">03 · Subframes</text>
      <rect x="751" y="395" width="183" height="48" rx="3" fill="#e7ebee"/><text x="775" y="426" fill="#26313a">04 · Calibration</text>
      <rect x="946" y="395" width="183" height="48" rx="3" fill="#e7ebee"/><text x="970" y="426" fill="#26313a">05 · WBPP</text>
      <rect x="1141" y="395" width="183" height="48" rx="3" fill="#e7ebee"/><text x="1165" y="426" fill="#26313a">06 · QC</text>
    </g>
    <g font-family="Arial, sans-serif">
      <rect x="166" y="484" width="1158" height="80" fill="#eef1f3" stroke="#cfd4d8"/>
      <rect x="186" y="503" width="42" height="42" rx="3" fill="#304b63"/>
      <text x="207" y="531" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">1</text>
      <text x="250" y="532" fill="#17191c" font-size="22" font-weight="700">Working setup and recovery points</text>
      <rect x="166" y="582" width="1158" height="80" fill="#fff" stroke="#cfd4d8"/>
      <rect x="186" y="601" width="42" height="42" rx="3" fill="#304b63"/>
      <text x="207" y="629" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">2</text>
      <text x="250" y="630" fill="#17191c" font-size="22" font-weight="700">Raw-light visual screening with Blink</text>
      <rect x="166" y="680" width="1158" height="80" fill="#eef1f3" stroke="#cfd4d8"/>
      <rect x="186" y="699" width="42" height="42" rx="3" fill="#304b63"/>
      <text x="207" y="727" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">3</text>
      <text x="250" y="728" fill="#17191c" font-size="22" font-weight="700">Quantitative frame selection</text>
      <g transform="translate(1218 507)">
        <circle cx="20" cy="20" r="19" fill="#315d3b"/><path d="M10 20l7 7 14-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="translate(1218 605)">
        <circle cx="20" cy="20" r="19" fill="#315d3b"/><path d="M10 20l7 7 14-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <rect x="1219" y="703" width="38" height="38" rx="3" fill="#fff" stroke="#78828a" stroke-width="3"/>
    </g>
    <rect x="166" y="798" width="610" height="56" fill="#f2f8f3"/>
    <rect x="166" y="798" width="6" height="56" fill="#315d3b"/>
    <text x="191" y="833" fill="#315d3b" font-family="Arial, sans-serif" font-size="17" font-weight="700">Proceed when the evidence passes inspection.</text>
    <text x="1324" y="839" fill="#62676d" text-anchor="end" font-family="ui-monospace, monospace" font-size="16">18 stages · 55 checks</text>
  </g>
</svg>
