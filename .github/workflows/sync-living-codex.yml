name: Sync Living Codex Submodule

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Capture current submodule SHA
        id: before
        run: |
          echo "sha=$(git -C vendor/the-living-codex rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Update submodule to latest main
        run: |
          git submodule update --remote --merge vendor/the-living-codex

      - name: Capture updated submodule SHA
        id: after
        run: |
          echo "sha=$(git -C vendor/the-living-codex rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- vendor/the-living-codex; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(sync): bump Living Codex submodule"
          title: "chore(sync): update Living Codex to latest main"
          body: |
            Automated submodule sync from `The-Living-Codex` `main`.

            - Previous SHA: `${{ steps.before.outputs.sha }}`
            - Updated SHA: `${{ steps.after.outputs.sha }}`

            Checklist:
            - [ ] Verify `/living-codex` loads
            - [ ] Verify rules data loads without 404
            - [ ] Verify import/export ZIP still works
            - [ ] Verify PDF/export fallback if popups are blocked
          branch: sync/living-codex
          delete-branch: false
          add-paths: |
            vendor/the-living-codex
