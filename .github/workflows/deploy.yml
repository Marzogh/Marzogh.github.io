name: Deploy Astro to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update Living Codex submodule to latest main
        run: |
          git submodule sync --recursive
          git submodule update --init --remote --recursive vendor/the-living-codex

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compute content/build dates
        run: |
          CONTENT_UPDATED_AT="$(git log -1 --format=%cs -- src/content || true)"
          if [ -z "$CONTENT_UPDATED_AT" ]; then
            CONTENT_UPDATED_AT="$(date -u +%Y-%m-%d)"
          fi
          echo "PUBLIC_CONTENT_UPDATED_AT=$CONTENT_UPDATED_AT" >> "$GITHUB_ENV"
          echo "PUBLIC_SITE_BUILD_AT=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
